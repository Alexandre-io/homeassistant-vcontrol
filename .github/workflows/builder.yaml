name: Builder

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Read release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          version=$(awk -F '"' '/^version:/ {print $2}' vcontrold/config.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$EVENT_NAME" == push ]]; then
            previous=$(git show "${BASE_SHA}:vcontrold/config.yaml" 2>/dev/null | awk -F '"' '/^version:/ {print $2}' || true)
            if [[ "$version" != "$previous" ]]; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./vcontrold
          platforms: ${{ matrix.platform }}
          load: true
          tags: vcontrol-audit:local
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=vcontrol-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=vcontrol-${{ matrix.arch }}
      - name: Run regression and runtime tests
        run: |
          bash tests/run.sh
          docker build -f tests/Dockerfile -t vcontrol-audit:tests .
          docker run --rm vcontrol-audit:tests
          bash tests/container_smoke.sh
          docker run --rm --entrypoint bash vcontrol-audit:tests -c \
            'shellcheck -s bash -e SC1091,SC2034 /etc/services.d/*.sh /etc/services.d/*/run /etc/services.d/*/finish'
      - name: Save tested image
        if: steps.version.outputs.publish == 'true'
        run: docker save vcontrol-audit:local | gzip > image.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        if: steps.version.outputs.publish == 'true'
        with:
          name: image-${{ matrix.arch }}
          path: image.tar.gz
          retention-days: 1

  publish:
    name: Publish tested ${{ matrix.arch }} image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: image-${{ matrix.arch }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: alexandreio
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(awk -F '"' '/^version:/ {print $2}' vcontrold/config.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker load --input image.tar.gz
          image="alexandreio/${ARCH}-homeassistant-vcontrol:${version}"
          docker tag vcontrol-audit:local "$image"
          docker push "$image"
